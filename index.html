<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- csp -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F2D52" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Isoligne" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Isoligne</title>
    <script src="theme-initial.js"></script>
    <style>
      /* Écran d'ouverture (brief : design/briefs/ouverture.md) : affiché avant même le code de l'app. */
      #ouverture {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--fond, #eef1ec); color: var(--trait, #1f4e8c);
        transition: opacity 260ms ease-out, visibility 0s 260ms;
      }
      @media (prefers-color-scheme: dark) { #ouverture { background: var(--fond, #0f2d52); color: var(--trait, #d6e4f0); } }
      #ouverture.fin { opacity: 0; visibility: hidden; }
      #ouverture svg { width: 132px; height: 132px; overflow: visible; }
      #ouverture .t { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: square; }
      #ouverture .p { fill: currentColor; }
      #ouverture .r { fill: var(--redline, #b8321c); opacity: 0; animation: ouv-pose 140ms 820ms forwards; }
      #ouverture .c { fill: none; stroke: var(--trait-2, #44658c); stroke-width: .8; stroke-dasharray: 2 3; stroke-dashoffset: 200;
        animation: ouv-trace 520ms cubic-bezier(.3,.6,.2,1) forwards; }
      #ouverture .axe { stroke: var(--trait-2, #44658c); stroke-width: .6; stroke-dasharray: 90; stroke-dashoffset: 90;
        animation: ouv-trace 360ms 220ms ease-out forwards; }
      #ouverture .logo { opacity: 0; animation: ouv-pose 220ms 520ms ease-out forwards; }
      @keyframes ouv-trace { to { stroke-dashoffset: 0; } }
      @keyframes ouv-pose { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #ouverture * { animation: none !important; }
        #ouverture .r, #ouverture .logo { opacity: 1; }
        #ouverture .c, #ouverture .axe { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="ouverture" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <circle class="c" cx="32" cy="32" r="30" pathLength="200" />
        <path class="t axe" d="M-13 32h90" /><path class="t axe" d="M32 -13v90" />
        <g class="logo">
          <rect class="t" x="24" y="24" width="16" height="16" />
          <path class="t" d="M24 24 14 14M40 24l10-10M32 40v10" />
          <rect class="p" x="9" y="9" width="7" height="7" /><rect class="p" x="48" y="9" width="7" height="7" /><rect class="p" x="28.5" y="49" width="7" height="7" />
        </g>
        <rect class="r" x="29" y="29" width="6" height="6" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
